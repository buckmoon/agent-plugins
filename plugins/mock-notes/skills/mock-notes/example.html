<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>経費申請モック v2</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 -apple-system, "Hiragino Sans", sans-serif; color: #1f2328; background: #f6f7f9; }
  .mockbar { background: #fff8c5; border-bottom: 1px solid #e6d27a; padding: 4px 16px; font-size: 12px; display: flex; gap: 12px; align-items: center; }
  .layout { display: flex; min-height: calc(100vh - 30px); }
  .side { width: 200px; background: #fff; border-right: 1px solid #e3e6ea; padding: 12px 0; flex-shrink: 0; }
  .side a { display: block; padding: 8px 16px; color: inherit; text-decoration: none; }
  .side a.on { background: #eef4ff; font-weight: 700; }
  .main { flex: 1; padding: 20px 24px; min-width: 0; }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; } .head h1 { margin: 0; font-size: 20px; } .head .sp { flex: 1; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { border-bottom: 1px solid #e3e6ea; padding: 8px 10px; text-align: left; }
  th { background: #fafbfc; font-size: 12px; color: #59636e; }
  button { font: inherit; padding: 4px 12px; border: 1px solid #c9ced6; background: #fff; border-radius: 4px; cursor: pointer; }
  button.primary { background: #2f6fd6; border-color: #2f6fd6; color: #fff; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid #e3e6ea; margin-bottom: 12px; }
  .tab { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 12px; }
  .tab.on { border-bottom-color: #2f6fd6; font-weight: 700; }
  .card { background: #fff; border: 1px solid #e3e6ea; border-radius: 6px; padding: 16px; }
  .frow { display: flex; gap: 12px; margin: 8px 0; align-items: center; } .frow label { width: 160px; color: #59636e; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; }
  .modal { background: #fff; border-radius: 8px; width: 460px; padding: 20px; }
  .modal h2 { margin: 0 0 8px; font-size: 18px; }
  .modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  input, select { font: inherit; padding: 4px 8px; border: 1px solid #c9ced6; border-radius: 4px; }
  .filler { height: 900px; }
</style>
</head>
<body>
<div id="app"></div>
<!-- 注記の部品。Slack などに1ファイルで配るときは、mock-notes.js の中身をこの script タグの中に貼る -->
<script src="mock-notes.js"></script>
<script>
const ui = { tab: 'rule', modal: false };
const rows = [
  { who: '青木', what: '交通費', amount: 1200, pay: '2026-11-25' },
  { who: '森', what: '書籍', amount: 3400, pay: '2026-11-25' },
];
function render() {
  const h = location.hash || '#/list';
  const body = h === '#/settings' ? settingsView() : listView();
  document.getElementById('app').innerHTML = `
    <div class="mockbar"><b>動作モック</b><span>本日＝2026-11-09</span></div>
    <div class="layout"><nav class="side">
      <a href="#/list" class="${h !== '#/settings' ? 'on' : ''}">申請一覧</a>
      <a href="#/settings" class="${h === '#/settings' ? 'on' : ''}">申請の設定</a>
    </nav><main class="main">${body}</main></div>
    ${ui.modal ? modalView() : ''}`;
}
function listView() {
  return `<div class="head"><h1>申請一覧</h1><span class="sp"></span><button id="csv">CSVで書き出す</button><button class="primary" data-act="new">新規申請</button></div>
  <table><thead><tr><th>申請者</th><th>内容</th><th>金額</th><th id="col-pay">精算予定日</th></tr></thead><tbody>
  ${rows.map((r) => `<tr><td>${r.who}</td><td>${r.what}</td><td>${r.amount.toLocaleString()}円</td><td>${r.pay}</td></tr>`).join('')}
  </tbody></table><div class="filler"></div>`;
}
function settingsView() {
  return `<div class="head"><h1>申請の設定</h1></div>
  <div class="tabs"><button class="tab ${ui.tab === 'rule' ? 'on' : ''}" data-act="tab" data-v="rule">承認ルール</button><button class="tab ${ui.tab === 'notice' ? 'on' : ''}" data-act="tab" data-v="notice">通知</button></div>
  ${ui.tab === 'rule'
    ? `<div class="card"><div class="frow"><label>上限額</label><input type="number" value="50000"> 円</div>
       <div class="frow"><label id="over-limit">上限額を超えたとき</label><select><option>部長の承認を追加する</option><option>申請できない</option></select></div></div>`
    : `<div class="card"><div class="frow"><label>通知先</label>申請者</div></div>`}`;
}
function modalView() {
  return `<div class="modal-bg"><div class="modal" role="dialog"><h2>新規申請</h2>
    <div class="frow"><label>内容</label><input></div>
    <div class="frow"><label>金額</label><input type="number"></div>
    <div class="frow"><label id="receipt-no">領収書番号</label><input placeholder="R-0000"></div>
    <div class="foot"><button data-act="close">やめる</button><button class="primary" data-act="close">申請する</button></div></div></div>`;
}
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (!a || a.closest('.mn-root')) return;
  if (a.dataset.act === 'tab') ui.tab = a.dataset.v;
  if (a.dataset.act === 'new') ui.modal = true;
  if (a.dataset.act === 'close') ui.modal = false;
  render();
});
window.addEventListener('hashchange', () => { ui.modal = false; render(); });
render();

// ---- 注記の登録 ----
MockNotes.init({
  key: 'expense-mock',
  baseline: 'v1（11/1 の版）',
  notes: [
    {
      id: 'over-limit', kind: 'conflict', screen: '申請の設定 > 承認ルール',
      target: '#over-limit',
      title: '上限額を超えた申請の扱い',
      where: '承認ルールの「上限額を超えたとき」',
      opinions: [
        { who: '青木さん（FB-003）', says: '部長の承認を追加して通したい。止めると現場が困る' },
        { who: '森さん（FB-004）', says: '申請できないようにしたい。後から差し戻すのは手間' },
      ],
      ask: 'どちらを既定にするか。モックは今、選べるようにしてある',
      path: [
        { click: '.side a[href="#/settings"]', say: '左メニューの「申請の設定」を押す' },
        { click: '[data-act="tab"][data-v="rule"]', say: '「承認ルール」タブを押す' },
      ],
    },
    {
      id: 'csv-format', kind: 'assumption', screen: '申請一覧',
      target: '#csv',
      where: '一覧の右上', what: '「CSVで書き出す」ボタンを置いた。列は一覧と同じ4列、文字コードは UTF-8 と仮に置いた',
      ask: '監査で使う列と文字コード（Excel で開くなら Shift_JIS か）', from: 'FB-005 森さん',
      path: [{ click: '.side a[href="#/list"]', say: '左メニューの「申請一覧」を押す' }],
    },
    {
      id: 'pay-date-column', kind: 'fixed', screen: '申請一覧',
      target: '#col-pay',
      where: '一覧の右端の列', what: '「精算予定日」の列を足した', from: 'FB-001 青木さん',
      path: [{ click: '.side a[href="#/list"]', say: '左メニューの「申請一覧」を押す' }],
    },
    {
      id: 'receipt-no', kind: 'fixed', screen: '申請一覧 > 新規申請',
      target: '#receipt-no',
      where: '新規申請の入力欄の3行目', what: '「領収書番号」の入力欄を足した', from: 'FB-002 青木さん',
      path: [
        { click: '.side a[href="#/list"]', say: '左メニューの「申請一覧」を押す' },
        { click: '[data-act="new"]', say: '「新規申請」ボタンを押す' },
      ],
    },
  ],
});
</script>
</body>
</html>
